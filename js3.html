<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        function checkme()
        {
            var n=document.getElementById("name").value;
            if(n.length==0)
            {
                alert("enter the name");
                document.getElementById("name").focus();
                return;
            }
                
            if(document.getElementById("degree1").checked)
            {
                document.getElementById("result").innerText=n+ ", you are not Eligible";
            }
            else if(document.getElementById("degree2").checked)
            {
                document.getElementById("result").innerText=n + ", you are Eligible";
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="row m-2">
            <div class="col">
                <label class="form-label">
                    Name
                </label>
                <input type="text" class="form-control" id="name">
            </div>
        </div>
        <div class="row m-2">
            <div class="col">
                <label>Degree</label>
            <input type="radio" class="form-check-input" name="degree" id="degree1">Under Graduate
            <input type="radio" class="form-check-input" name="degree" id="degree2">Graduate
            </div>
        </div>
        <div class="row m-2">
            <div class="col">
                <button class="btn btn-primary" onclick="checkme()">Check</button>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <p class="display-4" id="result"></p>
            </div>
        </div>
    </div>
</body>
</html>
