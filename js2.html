<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        function convert()
        {
            var dollars=document.getElementById("dollars").value;
            var rupees=dollars*95.91;
            document.getElementById("rupees").value=rupees;
        }
        function converttodollars()
        {
            var rupees=document.getElementById("rupees").value;
            var d=Math.round(rupees/95.97);
            document.getElementById("dollars").value=d;
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>Converting Dollars to INR</h2>

        <div>
            <label class="form-label">Dollars</label>
            <input type="text" class="form-control" id="dollars">
        </div>
        <div>
            <button class="btn btn-primary m-2" onclick="convert()">Convert</button>
        </div>
        <div>
            <label class="form-label">Rupees</label>
            <input type="text" class="form-control" id="rupees">
        </div>
        <div>
            <button class="btn btn-primary m-2" onclick="converttodollars()">Convert</button>
        </div>
    </div>
</body>
</html>
